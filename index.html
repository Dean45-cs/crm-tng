<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0066b3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TNG CRM" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Vertriebs-CRM für TNG Stadtnetz GmbH — Verträge, Tarifwechsel, Provisionen, Wiedervorlagen." />
    <title>TNG Stadtnetz CRM</title>
    <script>
      // Theme vor dem ersten Paint setzen, um Flackern zu vermeiden.
      (function () {
        try {
          var p = localStorage.getItem('crm-theme') || 'system';
          var dark = p === 'dark' ||
            (p === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
