<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <!-- Wie das Panel: ausschließlich eigene Dateien, nichts aus dem Netz. Das
       Mitteilungsfenster braucht nicht einmal eine Verbindung zu Supabase. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self';">
  <title>Mitteilungen</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="notify.css">
</head>
<body>
  <!-- Der Stapel. Leer heißt: Fenster versteckt (notify.js meldet Höhe 0). -->
  <div class="stack" data-role="stack" role="region" aria-live="polite" aria-label="Mitteilungen"></div>
  <script src="notify.js"></script>
</body>
</html>
