<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <!-- Kein Netzwerkzugriff außer zu Supabase: das Fenster lädt ausschließlich
       eigene Dateien, Skripte von außen sind ausgeschlossen. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src https://*.supabase.co;">
  <title>Stadtnetz CRM Copilot</title>

  <!-- Unverändert dieselben Styles wie im Jira-Tab. Die Anpassungen fürs
       eigene Fenster stehen ausschließlich in hud.css. -->
  <link rel="stylesheet" href="../../extension/styles/content.css">
  <link rel="stylesheet" href="hud.css">
</head>
<body>
  <!-- Bewusst leer: keine Titelleiste, keine Fensterknöpfe, kein Kreuz oben
       rechts. Das Fenster IST die Auskunft – alles, was man sonst am Rahmen
       bedient (immer im Vordergrund, Deckkraft, ausblenden, beenden), steht im
       Panel unter „Einstellungen · Overlay". Gezogen wird am Kopf des Panels,
       die Größe ändert der Anfasser unten rechts. -->
  <div class="hud-resize" data-role="hud-resize" title="Größe ändern" aria-hidden="true"></div>

  <!-- Genau die Reihenfolge aus manifest.json – die Dateien bauen beim Laden
       aufeinander auf (rules.js greift zum Beispiel sofort auf jiraReader zu).
       An zwei Stellen steht statt der Originaldatei ein Shim: für das, was es
       nur im Browser gibt (Seiten-DOM und Chromes eingebaute KI). Davor der
       Chrome-Ersatz, dahinter das, was nur die App hat. -->
  <script src="shim-chrome.js"></script>
  <script src="../../extension/src/config.js"></script>
  <script src="../../extension/src/commission.js"></script>
  <script src="../../extension/src/shared.js"></script>
  <script src="../../extension/src/supabase.js"></script>
  <script src="../../extension/src/ai-cache.js"></script>
  <script src="shim-jira-reader.js"></script>
  <script src="../../extension/src/rules.js"></script>
  <script src="shim-local-ai.js"></script>
  <script src="../../extension/src/theme.js"></script>
  <script src="../../extension/src/ui.js"></script>
  <script src="notes.js"></script>
  <!-- Ergänzt das Panel um das, was es nur auf dem Schreibtisch gibt:
       Verbindungspunkt, Notizknopf, Offline-Hinweis, Overlay-Einstellungen.
       Muss vor boot.js laufen, das anschließend mountet. -->
  <script src="hud-host.js"></script>
  <script src="boot.js"></script>
</body>
</html>
